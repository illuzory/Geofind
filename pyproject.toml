[project]
name = "geofind"
version = "0.3.0"
description = "Региональный MVP анализа доезда выездного сервиса"
requires-python = ">=3.12"
dependencies = [
  "streamlit==1.66.1", "altair==6.3.0", "folium==0.20.0",
  "pandas==3.1.0", "openpyxl==3.1.5", "shapely==2.2.0",
  "pyproj==3.8.0", "requests==2.34.2"
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "psutil==7.2.2", "playwright==1.64.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
